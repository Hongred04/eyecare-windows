; EyeCare 护眼提醒 · 配置文件
; 保存后约 3 秒内自动生效，不必重启；也可在托盘右键「设置…」用界面改。
; 数值允许小数；写错或超出范围会被自动夹紧到注释里标注的合法区间。
;（如果删掉本文件，程序启动时会自动重新生成一份默认配置）

[general]
enabled = true                 ; 总开关（false = 不打扰，但仍统计当日时长）
idle_timeout_sec = 120         ; 无键鼠输入超过这些秒数视为离座，暂停计时 [15~3600]
notify_balloon = true          ; 右下角气泡提示

[cycle]
work_min = 45                  ; 连续用机多少分钟提醒一次（循环）[0.05~600]
micro_break_min = 5            ; 小休时长 [0.05~120]
long_break_min = 20            ; 大休时长 [0.05~240]
micros_per_long = 4            ; 几次小休之后来一次大休（0 = 只有小休）
postpone_min = 5               ; 按「延后」推迟多少分钟
postpones_max = 2              ; 一次提醒最多可延后几次（0 = 不可延后）
grace_sec = 20                 ; 提前几秒预告「马上提醒」[0~600]

[daily]
daily_limit_min = 360          ; 每日用机上限（分钟）360 = 6 小时 [1~1440]
daily_warn_pct = 90            ; 到达上限的这个百分比时先提醒一次 [10~100]
daily_reset_at = 04:00         ; 每日统计的“日界”：早于此时刻仍算前一天
daily_lock = false             ; 超限后用遮罩提示（false = 只发气泡，不打断）
daily_notify_every_min = 15    ; 超限后每隔多少分钟再提醒一次

[overlay]
opacity_pct = 72               ; 遮罩不透明度 30~95
font_size = 30                 ; 休息卡片字号 14~72（再按屏幕缩放自动放大）
backdrop_color = #101826       ; 遮罩底色
card_color = #16233A           ; 卡片底色
accent_color = #4FD1A5         ; 倒计时颜色
show_tip = true                ; 显示护眼建议文字
keep_topmost = true            ; 休息时把遮罩顶回最上层
cover_taskbar = false          ; true = 连任务栏一起遮住

[log]
usage_log = true               ; 写 log/usage.log 与 log/daily.csv
keep_days = 30                 ; 汇总保留天数
